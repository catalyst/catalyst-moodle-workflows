# Refreshes the cached Moodle updates API response weekly.
#
# The cache file (.github/actions/parse-version/moodle-updates-cache.json) is
# committed to this repo and read by the parse-version action instead of hitting
# https://download.moodle.org/api/1.3/updates.php directly on every CI run.
# This eliminates org-wide hammering of the upstream API which is flaky and
# rate-limits consumers.
name: Refresh Moodle updates cache

on:
  schedule:
    # Every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  refresh:
    name: Fetch and commit updated Moodle updates cache
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch Moodle updates API
        run: |
          set -euo pipefail
          URL="https://download.moodle.org/api/1.3/updates.php?format=json&version=0.0&branch=3.8"
          DEST=".github/actions/parse-version/moodle-updates-cache.json"
          HTTP_CODE=$(curl -sSL --max-time 30 \
            -A "MoodleBot/5.1 (+https://catalyst-au.net)" \
            -w "%{http_code}" \
            -o "${DEST}.raw" \
            "$URL")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Unexpected HTTP $HTTP_CODE from $URL — keeping existing cache"
            rm -f "${DEST}.raw"
            exit 1
          fi
          # Validate and pretty-print for nicer diffs
          python3 -m json.tool "${DEST}.raw" > "$DEST"
          rm "${DEST}.raw"
          echo "Fetched $(wc -c < "$DEST") bytes (HTTP $HTTP_CODE)"

      - name: Commit updated cache if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/actions/parse-version/moodle-updates-cache.json
          if git diff --cached --quiet; then
            echo "No changes to Moodle updates cache."
          else
            git commit -m "chore: refresh Moodle updates cache [skip ci]"
            git push
          fi
