name: composer-publish

on:
  workflow_call:
    secrets:
      TRIGGER_URL:
        required: true
      TRIGGER_TOKEN:
        required: true

jobs:
  publish_composer:
    name: Trigger GitLab pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin code
        uses: actions/checkout@v3
        with:
          fetch-depth: 1
          submodules: true

      - name: Trigger GitLab pipeline
        env:
          TRIGGER_URL: ${{ secrets.TRIGGER_URL }}
          TRIGGER_TOKEN: ${{ secrets.TRIGGER_TOKEN }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail \
            --request POST \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "token=${TRIGGER_TOKEN}" \
            --data-urlencode "ref=main" \
            --data-urlencode "variables[source_repo]=git@github.com:${GITHUB_REPOSITORY}.git" \
            --data-urlencode "variables[source_commit]=${GITHUB_SHA}" \
            "${TRIGGER_URL}"